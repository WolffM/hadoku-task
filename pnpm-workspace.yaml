packages:
  - .
  - themes
  - task-ui-components

allowBuilds:
  esbuild: true

# pnpm's supply-chain age gate (pnpm 11 default) stays ON for third-party
# packages — protects against malicious versions yanked within days of publish.
# Our own @wolffm/* scope is exempt: it publishes frequently and we vet "latest"
# by hand, so the delay only ever hurts us.
minimumReleaseAgeExclude:
  - '@wolffm/*'

onlyBuiltDependencies:
  - esbuild

overrides:
  js-yaml: 4.1.1
