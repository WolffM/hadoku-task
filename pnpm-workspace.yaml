packages:
  - .
  - themes
  - task-ui-components

allowBuilds:
  esbuild: true

# Always resolve to the latest published version — disable pnpm's supply-chain
# age gate (default in pnpm 11). Our first-party @wolffm/* packages publish
# frequently and we vet "latest" by hand, so the delay only ever hurts us.
minimumReleaseAge: 0

onlyBuiltDependencies:
  - esbuild

overrides:
  js-yaml: 4.1.1
