name: e2e

# Fleet nightly e2e (hadoku_site programme 3). Dispatched by hadoku_site's
# nightly-e2e.yml with nightly_run_id set, or run by hand for a first proof.
# Most specs are route-mocked (e2e/helpers/mock-api.ts). The rest run against
# the local stack, which playwright.config.ts starts on free ports: the real
# task worker, the preset stub and the real prefs-api (from @wolffm/e2e-harness —
# no sibling hadoku_site checkout, no key). Only the specs that would hit
# production skip, each listed in e2e.json's e2eSkipAllow with its reason.
on:
  workflow_dispatch:
    inputs:
      nightly_run_id:
        description: The orchestrator's run id, so results group by night
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: e2e
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    # From e2e.json's timeoutMinutes.
    timeout-minutes: 20
    # No shared concurrency group: playwright.config.ts starts the stack and
    # vite on ports the kernel picks, so runs on one claw cannot collide
    # (hadoku-task#114).
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        id: pnpm
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          vault-key: ${{ secrets.KEY_SERVICE_TASK }}

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}
        run: pnpm install --frozen-lockfile

      # dist/ for @wolffm/themes and @wolffm/task-ui-components is gitignored;
      # the app imports their BUILT entrypoints (same reason new-worktree.mjs
      # builds them for a fresh worktree — see this repo's AGENTS.md).
      - name: Build workspace packages
        run: pnpm run build:packages

      # Idempotent on a self-hosted runner where chromium is already cached.
      - name: Install browser
        run: pnpm exec playwright install chromium

      - name: e2e
        run: pnpm run test:e2e:ci

      - name: Report results to the fleet e2e store
        if: always()
        uses: WolffM/hadoku-actions/report-e2e@v1
        with:
          report: e2e-report.json
          runner: playwright
          app: task
          nightly-run-id: ${{ inputs.nightly_run_id }}
          key: ${{ secrets.KEY_SERVICE_TASK }}

      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: task:e2e
          service-key: ${{ secrets.KEY_SERVICE_TASK }}
          started-at: ${{ env.JOB_STARTED_AT }}
          # The job's own limit: a timeout kill arrives as `cancelled`, and only
          # this tells report-job it was a failure rather than a superseded run.
          timeout-minutes: 20
