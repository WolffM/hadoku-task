name: vibeCompact

on:
  workflow_dispatch:
  # Daily schedule disabled 2026-08-24. Every repo carrying this workflow fired at
  # the SAME minute (06:00 UTC) — a synchronised fleet-wide fan-out onto claws that
  # each share one pnpm store across ~28 runner instances. That is the concurrency
  # shape that corrupted the pnpm stores on claw-2 and claw-3 tonight and took the
  # site's CI down for roughly an hour. Still runnable on demand via the Actions
  # tab. If it is restored, give each repo a DIFFERENT minute rather than putting
  # this line back verbatim.
  # schedule:
  #   - cron: "0 6 * * *" # daily poll; the activity gate exits in seconds when quiet

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Checkout (full history — the audit reads git forensics)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The steps below exist so the SMELLS lane measures this repo's code
      # instead of its own missing dependencies.
      #
      # That lane is type-coverage: it counts `any`-typed identifiers per file.
      # @wolffm/themes and @wolffm/task-ui-components declare their `types`
      # entry points inside gitignored dist/, so on a bare checkout tsc cannot
      # resolve them and every identifier derived from those imports degrades
      # to `any`. The count that comes back is a property of the checkout, not
      # of the source.
      #
      # Measured 2026-08-17 against anchor 0bdb52a: src/utils/theme.ts reported
      # 15 anys with node_modules but no dist, and 0 with the packages built.
      # The file contains no `any` at all. Because the lane scores by DENSITY,
      # a 36-line file scored the 1.5 cap and became the audit's rank-1
      # "corroborated" work item — a fully fictional finding sitting at the top
      # of the briefing.
      #
      # node_modules/ and dist/ are both in vibecheck's EXCLUDED_DIRS, so
      # populating them adds no candidate files to any lane.
      #
      # setup-node BEFORE corepack — see ci.yml: `corepack enable` symlinks its
      # shims next to the active node, and without setup-node that is the
      # host's /usr/bin, which the runner user cannot write.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build workspace packages
        run: pnpm run build:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Run vibeCompact
        uses: WolffM/vibecheck@main
        with:
          mode: audit
          github_token: ${{ secrets.GITHUB_TOKEN }}
