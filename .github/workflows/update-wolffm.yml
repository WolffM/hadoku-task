name: Auto-update @wolffm packages

on:
  repository_dispatch:
    types: [wolffm_published]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # safety net every 6h

concurrency:
  group: update-wolffm
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  update:
    runs-on: [self-hosted, hadoku-builder]
    timeout-minutes: 10
    steps:
      # Before checkout, so the outcome report has a start time even when the
      # run dies in checkout itself.
      - name: Stamp the start time
        run: echo "RUN_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The bot pushes straight to a protected main. The default GITHUB_TOKEN
          # is not an admin, so its push is rejected with "protected branch hook
          # declined" — and only when there is actually something to push, which
          # is why this can sit green for weeks. HADOKU_SITE_TOKEN is WolffM's
          # PAT and the branch has enforce_admins=false, so it bypasses. Same
          # pattern hadoku_site/update-packages.yml already uses.
          token: ${{ secrets.HADOKU_SITE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Auth goes in ~/.npmrc, NOT the repo's tracked .npmrc (which carries the
      # registry line and nothing else). Writing the token into the tracked file
      # leaves the tree permanently dirty, which defeats the no-op check below —
      # and puts a secret one stray `git add .` away from being committed.
      # Mirrors publish.yml.

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Configure npm auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.HADOKU_SITE_TOKEN }}" > ~/.npmrc
          echo "@wolffm:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Update @wolffm/* to latest (majors included)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          # -r so themes/ + task-ui-components/ workspace subpackages
          # also pick up any external @wolffm/* dep updates. workspace:*
          # self-refs are unaffected.
          pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store update -r --latest "@wolffm/*"


      # Always-latest is the policy, so "not at latest" is a failure, not a note.
      # This runs AFTER the update above and re-reads the manifests, so it also
      # catches an update that silently did nothing (a lost dispatch, a registry
      # hiccup, a range pnpm declined to touch). The fan-out that triggers this
      # workflow is best-effort; this step is what makes a missed one visible.
      - name: Assert every @wolffm dependency is at latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          node -e '
            const {execSync}=require("child_process"), fs=require("fs");
            const seen=new Set(); const stale=[]; const unchecked=[];
            const manifests=execSync("git ls-files \"*package.json\"").toString().trim().split("\n");
            for (const m of manifests) {
              if (!m || m.includes("node_modules")) continue;
              let pkg; try { pkg=JSON.parse(fs.readFileSync(m,"utf8")); } catch { continue; }
              for (const field of ["dependencies","devDependencies"]) {
                for (const [name,range] of Object.entries(pkg[field]||{})) {
                  if (!name.startsWith("@wolffm/")) continue;
                  // workspace: and * are not version claims — nothing to compare.
                  const r=String(range);
                  if (r.startsWith("workspace:") || r==="*") continue;
                  // Key by FIELD too, not just name+manifest: a package can sit in
                  // BOTH dependencies and devDependencies of one file with DIFFERENT
                  // ranges, and deduping by name alone checked whichever came first
                  // and silently skipped the stale one.
                  const key=name+"@"+m+"#"+field; if (seen.has(key)) continue; seen.add(key);
                  let latest; try {
                    latest=execSync(`npm view ${name} version --registry=https://npm.pkg.github.com`,{stdio:["ignore","pipe","ignore"]}).toString().trim();
                  } catch {
                    // NOT `continue`. An unreachable registry is indistinguishable
                    // from "at latest" if it is skipped, so a 401 here used to make
                    // the whole step report success while checking nothing — which
                    // is exactly what it happened to do wherever the .npmrc was not
                    // in this step working directory.
                    unchecked.push(`${name} in ${m}: could not read the registry`);
                    continue;
                  }
                  const declared=(r.match(/(\d+\.\d+\.\d+)/)||[])[1];
                  if (declared && latest && declared!==latest) {
                    stale.push(`${name} in ${m}: declares ${r}, latest is ${latest}`);
                  }
                }
              }
            }
            if (unchecked.length) {
              for (const u of unchecked) console.log(`::error::${u}`);
              console.error(`\n${unchecked.length} @wolffm package(s) could not be checked at all.`);
              console.error("Usually the .npmrc is not in this step working directory.");
              process.exit(1);
            }
            if (stale.length) {
              for (const s of stale) console.log(`::error::${s}`);
              console.error(`\n${stale.length} @wolffm dependency/ies are not at latest.`);
              console.error("Every @wolffm package must track the newest version, majors included.");
              console.error("If a major needs code changes, make them — do not pin back.");
              process.exit(1);
            }
            console.log("All @wolffm dependencies are at latest.");
          '
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Scope the no-op check to exactly the files we commit. A repo-wide
          # `git status` check would let any unrelated dirt fall through to an
          # empty `git commit`, which exits non-zero and fails the run.
          FILES="package.json pnpm-lock.yaml themes/package.json task-ui-components/package.json"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "✅ No @wolffm package updates available"
            exit 0
          fi

          git add $FILES
          git commit -m "chore: auto-update @wolffm/* to latest"

          # No explicit publish.yml dispatch here. Checkout authenticates with
          # HADOKU_SITE_TOKEN (a PAT), and a PAT push DOES trigger `on: push`
          # workflows — only GITHUB_TOKEN pushes are loop-suppressed. The old
          # dispatch dated from the GITHUB_TOKEN era; after the PAT switch it
          # made every auto-update run publish.yml TWICE (push + dispatch, same
          # second), which published two versions per dep bump — 4.0.1 and 4.0.2,
          # nine seconds apart, on 2026-08-05.
          for i in 1 2 3; do
            push_out=$(git push 2>&1) && rc=0 || rc=$?
            echo "$push_out"
            if [ "$rc" -eq 0 ]; then
              echo "✅ Pushed — the PAT push triggers publish.yml on its own"
              exit 0
            fi
            # A branch-protection rejection (GH006 / "protected branch hook
            # declined") is deterministic — rebasing and retrying cannot fix it,
            # and on 2026-08-04 doing so buried the real cause under ten
            # identical "race" retries. Name the fix and die on the first line.
            if echo "$push_out" | grep -qiE "GH006|protected branch hook declined"; then
              echo "::error::Push rejected by branch protection, not a race. The pushing credential cannot satisfy main's required checks — checkout must use a token that bypasses them (token: HADOKU_SITE_TOKEN, see the checkout step). See docs/incident-2026-08-04-ci-failures.md."
              exit 1
            fi
            echo "Push failed (attempt $i), rebasing..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "❌ Push failed after retries"
          exit 1

      - name: Report the outcome so a silent red streak screams
        # On 2026-08-04 this workflow failed ten times in a row and told nobody
        # until the next daily CI digest. POST /health/api/jobs is the fleet's
        # one alerting path — monitoring-api hangs the Discord alert on the
        # outcome itself (job-alerts.ts), throttled to one reminder per 24h,
        # with a recovery notice when it goes green again. Same pattern as
        # tenhands/taskauto.yml. A runner that dies mid-run still can't report
        # itself; that rarer class stays covered by the daily digest.
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          HADOKU_SERVICE_KEY: ${{ secrets.KEY_SERVICE_TASK }}
        run: |
          case "$OUTCOME" in
            success) status=succeeded ;;
            failure) status=failed ;;
            # A cancel (concurrency superseded it) is not breakage, and must not
            # clear a live failure streak either — stay silent.
            *) echo "outcome=$OUTCOME — not reported"; exit 0 ;;
          esac

          if [ -z "$HADOKU_SERVICE_KEY" ]; then
            echo "::warning::KEY_SERVICE_TASK is unset — outcome not reported"
            exit 0
          fi

          duration_ms=$(( ($(date -u +%s) - ${RUN_STARTED_AT:-$(date -u +%s)}) * 1000 ))

          jq -n --arg st "$status" --arg run "gha_$RUN_ID" \
                --arg err "auto-update run failed — $RUN_URL" \
                --argjson d "$duration_ms" \
            '{job_name: "hadoku-task:update-wolffm", status: $st, run_id: $run, duration_ms: $d}
             + (if $st == "failed" then {error: $err} else {} end)' > /tmp/update-wolffm-outcome.json

          # Never fail the job over a reporting blip. `-f` so a non-2xx shows.
          curl -sS -f -X POST https://hadoku.me/health/api/jobs \
            -H "X-User-Key: $HADOKU_SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/update-wolffm-outcome.json \
            || echo "::warning::could not report outcome to monitoring-api"
