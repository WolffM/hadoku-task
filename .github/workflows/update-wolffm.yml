name: Auto-update @wolffm packages

on:
  repository_dispatch:
    types: [wolffm_published]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # safety net every 6h

concurrency:
  group: update-wolffm
  cancel-in-progress: true

permissions:
  contents: write
  packages: read
  actions: write # dispatch publish.yml after an auto-update commit (see below)

jobs:
  update:
    runs-on: [self-hosted, hadoku-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Auth goes in ~/.npmrc, NOT the repo's tracked .npmrc (which carries the
      # registry line and nothing else). Writing the token into the tracked file
      # leaves the tree permanently dirty, which defeats the no-op check below —
      # and puts a secret one stray `git add .` away from being committed.
      # Mirrors publish.yml.

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Configure npm auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.HADOKU_SITE_TOKEN }}" > ~/.npmrc
          echo "@wolffm:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Update @wolffm/* to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          # -r so themes/ + task-ui-components/ workspace subpackages
          # also pick up any external @wolffm/* dep updates. workspace:*
          # self-refs are unaffected by --latest.
          pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store update -r "@wolffm/*" --latest

      - name: Commit and push if changed
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Scope the no-op check to exactly the files we commit. A repo-wide
          # `git status` check would let any unrelated dirt fall through to an
          # empty `git commit`, which exits non-zero and fails the run.
          FILES="package.json pnpm-lock.yaml themes/package.json task-ui-components/package.json"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "✅ No @wolffm package updates available"
            exit 0
          fi

          git add $FILES
          git commit -m "chore: auto-update @wolffm/* to latest"

          # Push, then explicitly dispatch publish.yml. This push is authenticated
          # with GITHUB_TOKEN, and GitHub refuses to trigger `on: push` workflows
          # from a GITHUB_TOKEN push (loop-prevention) — so publish.yml would never
          # fire on its own, and the freshly-bumped @wolffm/* deps would sit in the
          # lockfile without ever being rebuilt into a published @wolffm/task. The
          # dispatch closes that gap; it only runs when we actually pushed a change.
          for i in 1 2 3; do
            if git push; then
              echo "✅ Pushed — dispatching publish.yml so the bump reaches the registry"
              # REST dispatch (no gh dependency on the self-hosted runner). Needs
              # the actions:write permission declared above. Non-fatal: if it fails
              # the bump is still committed, just not yet published.
              http=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/workflows/publish.yml/dispatches" \
                -d '{"ref":"main"}') || true
              if [ "$http" = "204" ]; then
                echo "✅ publish.yml dispatched"
              else
                echo "⚠️  publish dispatch returned HTTP $http — run it manually: gh workflow run publish.yml --ref main"
              fi
              exit 0
            fi
            echo "Push failed (attempt $i), rebasing..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "❌ Push failed after retries"
          exit 1
