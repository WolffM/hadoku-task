# vibeCop Analysis Workflow
#
# This workflow runs vibeCop static analysis on your repository.
# For more info: https://github.com/WolffM/vibecop

name: vibeCop Analysis

on:
  # Run weekly on Monday at 3am UTC
  schedule:
    - cron: "0 3 * * 1"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      cadence:
        description: "Analysis cadence"
        required: false
        default: "weekly"
        type: choice
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run vibeCop
        uses: WolffM/vibecop@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cadence: ${{ github.event.inputs.cadence || 'weekly' }}
