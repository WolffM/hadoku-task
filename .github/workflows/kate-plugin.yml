name: Kate Plugin (build check)

# Compile-check only — there is no cloud deploy for the Kate plugin.
# Distribution is a local `cmake --install` on the user's machine.
on:
  push:
    branches:
      - main
    paths:
      - 'plugins/kate/**'
      - '.github/workflows/kate-plugin.yml'
  pull_request:
    paths:
      - 'plugins/kate/**'
      - '.github/workflows/kate-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    # GitHub-hosted Ubuntu — the self-hosted builder is a JS-only box without the
    # KF6/Qt6 toolchain. Ubuntu 24.04 (noble) carries the KF6 dev packages.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KF6/Qt6 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-declarative-dev \
            libkf6texteditor-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6xmlgui-dev \
            libkf6wallet-dev \
            gettext

      - name: Configure
        working-directory: plugins/kate
        run: cmake -B build -S . -DCMAKE_INSTALL_PREFIX="$HOME/.local"

      - name: Build
        working-directory: plugins/kate
        run: cmake --build build --parallel
