name: Kate Plugin (build check)

# Compile-check only — there is no cloud deploy for the Kate plugin.
# Distribution is a local `cmake --install` on the user's machine.
on:
  push:
    branches:
      - main
    paths:
      - 'plugins/kate/**'
      - '.github/workflows/kate-plugin.yml'
  pull_request:
    paths:
      - 'plugins/kate/**'
      - '.github/workflows/kate-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    # HOSTED, deliberately — see allowHosted in hadoku_site's
    # repo-policy-manifest.json. KF6 dev packages only exist on Debian trixie /
    # Ubuntu 25.04, neither of which is a GitHub-hosted runner. Run inside a
    # Debian 13 (trixie) container, which carries KF6 6.x — matching the target
    # desktop exactly. The container: step needs Docker, which the claws don't
    # have (verified 2026-08-30). Revisit if the claws gain Docker.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install KF6/Qt6 toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            cmake \
            build-essential \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-declarative-dev \
            libkf6texteditor-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6xmlgui-dev \
            libkf6wallet-dev \
            gettext

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        working-directory: plugins/kate
        run: cmake -B build -S . -DCMAKE_INSTALL_PREFIX="$HOME/.local"

      - name: Build
        working-directory: plugins/kate
        run: cmake --build build --parallel
