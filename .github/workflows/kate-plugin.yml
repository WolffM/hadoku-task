name: Kate Plugin (build check)

# Compile-check only — there is no cloud deploy for the Kate plugin.
# Distribution is a local `cmake --install` on the user's machine.
on:
  push:
    branches:
      - main
    paths:
      - 'plugins/kate/**'
      - '.github/workflows/kate-plugin.yml'
  pull_request:
    paths:
      - 'plugins/kate/**'
      - '.github/workflows/kate-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # KF6 dev packages only exist on Debian trixie / Ubuntu 25.04, neither of
    # which is a GitHub-hosted runner. Run inside a Debian 13 (trixie) container,
    # which carries KF6 6.x — matching the target desktop exactly.
    container: debian:trixie
    steps:
      - name: Install KF6/Qt6 toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            cmake \
            g++ \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-declarative-dev \
            libkf6texteditor-dev \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6xmlgui-dev \
            libkf6wallet-dev \
            gettext

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        working-directory: plugins/kate
        run: cmake -B build -S . -DCMAKE_INSTALL_PREFIX="$HOME/.local"

      - name: Build
        working-directory: plugins/kate
        run: cmake --build build --parallel
