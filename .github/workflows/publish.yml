name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
    paths-ignore:
      # The Kate plugin and docs don't affect the published npm packages —
      # skip the publish for plugin- or docs-only commits.
      - 'plugins/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/kate-plugin.yml'
  workflow_dispatch:  # Allow manual trigger

# No commit carries a version. Each changed package's version is set below
# (hadoku-actions/next-version: one patch above the registry's newest) in this
# workspace only, and nothing is written back to main. A committed version
# ABOVE the registry's newest is published as it stands — the one way to make a
# deliberate minor or major bump.
permissions:
  contents: read
  packages: write
  # Read this workflow's own run history: the change check reaches back to
  # the last commit a publish succeeded on.
  actions: read

# One publish at a time. Two overlapping runs walk the registry to the same
# next version and the newer commit dies 409 unpublished
# (hadoku-dataplatform#31). Never cancel-in-progress: a run stopped between
# publishing and notifying ships a release hadoku_site never hears about.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        id: pnpm
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          vault-key: ${{ secrets.KEY_SERVICE_TASK }}

      - name: Detect changed packages
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ui=false; themes=false; task=false

          # A manual dispatch is an explicit "publish now", and it exists to
          # recover a publish a push skipped — so it must never be vetoed by the
          # same check that skipped it.
          #
          # This used to fall through to the HEAD~1 branch below, on the argument
          # that re-evaluating the last commit still recovers a stranded publish.
          # That holds for the version step, which reads the registry and so
          # always has a fresh version to publish — but not for this gate, which
          # vetoes the publish before it runs. A three-commit push where themes
          # changed first left no dispatch that could ship it, and the only way
          # out was a no-op commit under themes/.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: publishing every package unconditionally"
            echo "ui=true" >> $GITHUB_OUTPUT
            echo "themes=true" >> $GITHUB_OUTPUT
            echo "task=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Base of the comparison: the commit before the PUSH, which covers
          # squash merges and multi-commit pushes alike. A branch's first push
          # sends the all-zero sha and a force-push can name an unreachable
          # commit; fall back to the last commit in both cases — a narrower range
          # than the truth, but never a broken one.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Base is deeper than fetch-depth — pull just that commit, else fall
            # back to the immediate parent.
            git fetch --depth=1 origin "$BEFORE" 2>/dev/null || true
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || \
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          # The concurrency group keeps ONE run waiting, so a third push cancels it
          # and its range is never diffed; a failed run strands its range too. Reach
          # back to the last commit a publish SUCCEEDED on when that is older than the
          # push base (hadoku-dataplatform#31). An unreadable history keeps the base.
          last=$(node -e '
            const file = process.env.GITHUB_WORKFLOW_REF.split("@")[0].split("/").pop();
            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}` +
              `/actions/workflows/${file}/runs?status=success&per_page=1` +
              `&branch=${encodeURIComponent(process.env.GITHUB_REF_NAME)}`;
            fetch(url, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`,
                                    accept: "application/vnd.github+json" } })
              .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
              .then(j => console.log(j.workflow_runs[0]?.head_sha ?? ""))
              .catch(e => { console.error(e.message); process.exit(1); });
          ') || { echo "::warning::Could not read the last successful publish; using the push base"; last=""; }
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null \
            && [ "$(git rev-parse "$last")" != "$(git rev-parse "$BEFORE")" ] \
            && git merge-base --is-ancestor "$last" "$BEFORE"; then
            echo "Last successful publish was ${last}, before the push base: widening the range to it"
            BEFORE="$last"
          fi
          echo "Comparing ${BEFORE}..HEAD"
          CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
          echo "--- changed files ---"
          echo "$CHANGED"
          echo "---------------------"

          if echo "$CHANGED" | grep -qE "^task-ui-components/"; then ui=true; fi
          if echo "$CHANGED" | grep -qE "^themes/"; then themes=true; fi
          # The second -Ev drops worker/test/ and worker/migrations/: they sit under
          # a prefix that means "task", but `files` is ["dist", ...] so neither can
          # reach the tarball — only worker/src does, compiled into dist/worker.
          # Test harnesses and migration SQL must not burn a version, same as
          # docs/, e2e/, scripts/ and plugins/.
          if echo "$CHANGED" | grep -Ev "^(themes|task-ui-components)/" | grep -Ev "^worker/(test|migrations)/" | grep -qE "^(src/|worker/|package\.json|vite\.config\.|tsconfig\.|tsup\.)"; then task=true; fi

          # Dependency chain: `task` bundles both themes + task-ui-components,
          # and themes imports task-ui-components. A dependency change must
          # republish its dependents so their bundled copy AND pinned version
          # stay in sync — otherwise the published `task` ships a stale bundle.
          if [ "$ui" = "true" ]; then themes=true; task=true; fi
          if [ "$themes" = "true" ]; then task=true; fi

          echo "ui=$ui" >> $GITHUB_OUTPUT
          echo "themes=$themes" >> $GITHUB_OUTPUT
          echo "task=$task" >> $GITHUB_OUTPUT
          echo "Detected → task-ui-components=$ui themes=$themes task=$task"

      - name: Configure npm for GitHub Packages
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc
          echo "@wolffm:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      # Validate that required manually-maintained files exist
      - name: Validate required source files
        run: |
          echo "Checking for required manually-maintained files..."
          missing_files=0

          # Check for entry.d.ts (required by vite.config.ts copy-types plugin)
          if [ ! -f "src/app/entry.d.ts" ]; then
            echo "❌ ERROR: src/app/entry.d.ts is missing!"
            echo "   This file should be committed (exception in .gitignore)"
            missing_files=1
          else
            echo "✓ src/app/entry.d.ts exists"
          fi

          # Check that CSS files exist in task-ui-components (required by copy-css script)
          if [ ! -f "task-ui-components/src/theme-picker.css" ]; then
            echo "❌ ERROR: task-ui-components/src/theme-picker.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/theme-picker.css exists"
          fi

          if [ ! -f "task-ui-components/src/toaster.css" ]; then
            echo "❌ ERROR: task-ui-components/src/toaster.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/toaster.css exists"
          fi

          if [ ! -f "task-ui-components/src/context-menu.css" ]; then
            echo "❌ ERROR: task-ui-components/src/context-menu.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/context-menu.css exists"
          fi

          if [ ! -f "task-ui-components/src/modal.css" ]; then
            echo "❌ ERROR: task-ui-components/src/modal.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/modal.css exists"
          fi

          # Check themes CSS file
          if [ ! -f "themes/src/style.css" ]; then
            echo "❌ ERROR: themes/src/style.css is missing!"
            missing_files=1
          else
            echo "✓ themes/src/style.css exists"
          fi

          if [ $missing_files -eq 1 ]; then
            echo ""
            echo "💡 Tip: Check .gitignore for overly broad ignore patterns"
            echo "    that might be excluding required source files."
            exit 1
          fi

          echo "✅ All required source files present"

      # Versions BEFORE any build: src/utils/version.ts imports each
      # package.json and embeds the version in the bundle, and pnpm publish
      # rewrites `workspace:*` to the dependency's version as it stands here.
      # One patch above the registry's newest, in this workspace only. A
      # package that did not change is never read; the dependency chain is the
      # detect step's job.
      #
      # `published: 'true'` means the registry's newest was published by this
      # very commit (its gitHead), so a re-run skips that publish and keeps the
      # notify. CAVEAT, measured 2026-11-02: `pnpm publish` records NO gitHead
      # (@wolffm/themes@5.13.17 and task@5.28.17 carry none), so here it is
      # never 'true' and a re-run publishes one more patch. Harmless — newest
      # wins — and pnpm publish stays: it is what rewrites `workspace:*`.
      - name: Version UI Components package
        id: version_ui
        if: steps.changes.outputs.ui == 'true'
        uses: WolffM/hadoku-actions/next-version@v1
        with:
          package-dir: task-ui-components
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Version Themes package
        id: version_themes
        if: steps.changes.outputs.themes == 'true'
        uses: WolffM/hadoku-actions/next-version@v1
        with:
          package-dir: themes
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Version Task package
        id: version_task
        if: steps.changes.outputs.task == 'true'
        uses: WolffM/hadoku-actions/next-version@v1
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      # @wolffm/task's `dependencies` name themes and task-ui-components as
      # `workspace:*`, which pnpm publish turns into the version in THIS
      # workspace. For a package that changed, next-version just set it. For one
      # that did not, package.json holds whatever was last committed — stale by
      # design, since no commit carries a version — so task would ship pinned to
      # an old release (and version.ts would log it). Point those at the
      # registry's newest instead. An unreadable registry fails the step.
      - name: Unchanged workspace dependencies carry the registry's newest
        if: steps.changes.outputs.task == 'true' && (steps.changes.outputs.ui != 'true' || steps.changes.outputs.themes != 'true')
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}
          UI_CHANGED: ${{ steps.changes.outputs.ui }}
          THEMES_CHANGED: ${{ steps.changes.outputs.themes }}
        run: |
          pin() {
            local dir=$1 name newest
            name=$(node -p "require('./$dir/package.json').name")
            if ! newest=$(cd "$dir" && npm view "$name" version) || [ -z "$newest" ]; then
              echo "::error::could not read $name's newest version from the registry"
              exit 1
            fi
            node -e '
              const fs = require("fs"); const [p, v] = process.argv.slice(1);
              const src = fs.readFileSync(p, "utf8");
              const next = src.replace(/("version"\s*:\s*")[^"]*(")/, (_, a, b) => a + v + b);
              if (!next.includes(`"version": "${v}"`)) { console.error("could not patch " + p); process.exit(1); }
              fs.writeFileSync(p, next);
            ' "$dir/package.json" "$newest"
            echo "$name: unchanged, depended on at the registry's newest $newest"
          }
          [ "$UI_CHANGED" = "true" ] || pin task-ui-components
          [ "$THEMES_CHANGED" = "true" ] || pin themes

      # Build in dependency order: UI Components → Themes → Task
      # themes FIRST: task-ui-components imports the theme model (context,
      # icons, types) from it now, so its build needs themes/dist present.
      # This order was the other way round until the icons moved.
      - name: Build Themes package
        run: pnpm --filter @wolffm/themes run build

      - name: Build UI Components package
        run: pnpm --filter @wolffm/task-ui-components run build

      - name: Build Task package
        run: pnpm run build:all
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      # Publish in dependency order: UI Components → Themes → Task, gated on the
      # up-front change flags (steps.changes).
      - name: Publish UI Components package
        if: steps.changes.outputs.ui == 'true' && steps.version_ui.outputs.published != 'true'
        run: pnpm --filter @wolffm/task-ui-components publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Themes package
        if: steps.changes.outputs.themes == 'true' && steps.version_themes.outputs.published != 'true'
        run: pnpm --filter @wolffm/themes publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Task package
        if: steps.changes.outputs.task == 'true' && steps.version_task.outputs.published != 'true'
        run: pnpm --filter @wolffm/task publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Defense in depth: pnpm publish does not fail loudly on duplicate-version
      # no-ops in pnpm 9+. Verify each package that was SUPPOSED to publish
      # actually landed on the registry, so any version/detection regression
      # fails the workflow loudly instead of stranding a dependent on a missing
      # pin.
      - name: Verify publishes appeared on registry
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.themes == 'true' || steps.changes.outputs.task == 'true'
        run: |
          verify_published() {
            local pkg_name=$1
            local pkg_path=$2
            local version=$(node -p "require('${pkg_path}/package.json').version")
            if ! npm view "${pkg_name}@${version}" version 2>/dev/null | grep -q "$version"; then
              echo "❌ ERROR: ${pkg_name}@${version} did not appear on the registry after publish"
              exit 1
            fi
            echo "✓ Verified ${pkg_name}@${version} on registry"
          }
          if [ "${{ steps.changes.outputs.ui }}" = "true" ]; then
            verify_published "@wolffm/task-ui-components" "./task-ui-components"
          fi
          if [ "${{ steps.changes.outputs.themes }}" = "true" ]; then
            verify_published "@wolffm/themes" "./themes"
          fi
          if [ "${{ steps.changes.outputs.task }}" = "true" ]; then
            verify_published "@wolffm/task" "."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      # hadoku_site is told through mgmt-api with this repo's own service key
      # (hadoku-actions/repo-action). A refused or unanswered notify FAILS the
      # job: the old curl only warned, and a dropped dispatch is a release the
      # site never picks up.
      - name: Which packages were published, in dependency order
        id: published
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.themes == 'true' || steps.changes.outputs.task == 'true'
        run: |
          pkgs=()
          [ "${{ steps.changes.outputs.ui }}" = "true" ] && pkgs+=('"@wolffm/task-ui-components"')
          [ "${{ steps.changes.outputs.themes }}" = "true" ] && pkgs+=('"@wolffm/themes"')
          [ "${{ steps.changes.outputs.task }}" = "true" ] && pkgs+=('"@wolffm/task"')
          echo "packages=[$(IFS=,; echo "${pkgs[*]}")]" >> "$GITHUB_OUTPUT"

      - name: Notify hadoku_site (packages_updated)
        if: steps.published.outputs.packages != ''
        uses: WolffM/hadoku-actions/repo-action@v1
        with:
          verb: notify
          body: '{"event_type":"packages_updated","client_payload":{"packages":${{ steps.published.outputs.packages }},"sha":"${{ github.sha }}"}}'
          service-key: ${{ secrets.KEY_SERVICE_TASK }}

      # npmjs copies, for builds outside the fleet (hadoku-actions/publish-npmjs).
      # AFTER the notify, so a failure here never holds back a fleet release.
      - name: Stage UI Components package for npmjs
        if: steps.changes.outputs.ui == 'true'
        uses: WolffM/hadoku-actions/publish-npmjs@v1
        with:
          package-dir: task-ui-components

      - name: Stage Themes package for npmjs
        if: steps.changes.outputs.themes == 'true'
        uses: WolffM/hadoku-actions/publish-npmjs@v1
        with:
          package-dir: themes

  # npmjs publishes through trusted publishing, which refuses self-hosted
  # runners: the publish job above staged the gated tarballs, and this hosted
  # job (no checkout, no secret) hands them to npm. Each
  # @hadoku/* package trusts exactly this repo and workflow file.
  npmjs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: WolffM/hadoku-actions/publish-npmjs/publish@v1
