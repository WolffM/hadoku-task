name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
    paths-ignore:
      # The Kate plugin and docs don't affect the published npm packages —
      # skip the auto-bump/publish for plugin- or docs-only commits.
      - 'plugins/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/kate-plugin.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Changed from 'read' to allow auto-bumping versions
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, hadoku-builder]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      # Detect which packages changed ONCE, up front, from the FULL push range
      # (event.before..sha) — before any later step moves HEAD. Every downstream
      # step reads these outputs and never re-runs `git diff HEAD~1 HEAD`.
      #
      # Why this matters: the auto-bump step below commits + pushes a version
      # bump. Any change-detection that runs AFTER that would diff the auto-bump
      # commit (package.json + lockfile only) and conclude "task-ui-components did
      # not change" — silently skipping its publish while `task` still ships
      # pinned to the never-published version. That exact bug stranded the
      # registry twice. HEAD~1..HEAD is also wrong for squash merges and
      # multi-commit pushes; event.before..sha covers all three.
      - name: Detect changed packages
        id: changes
        run: |
          ui=false; themes=false; task=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run = reconcile mode: consider every package so any version
            # not yet on the registry gets (re)published. Already-published
            # versions no-op on publish and are confirmed by the verify step.
            echo "workflow_dispatch → reconcile mode (all packages considered)"
            ui=true; themes=true; task=true
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              # Base is deeper than fetch-depth — pull just that commit, else fall
              # back to the immediate parent.
              git fetch --depth=1 origin "$BEFORE" 2>/dev/null || true
              git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || \
                BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "Comparing ${BEFORE}..HEAD"
            CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
            echo "--- changed files ---"
            echo "$CHANGED"
            echo "---------------------"

            if echo "$CHANGED" | grep -qE "^task-ui-components/"; then ui=true; fi
            if echo "$CHANGED" | grep -qE "^themes/"; then themes=true; fi
            if echo "$CHANGED" | grep -Ev "^(themes|task-ui-components)/" | grep -qE "^(src/|worker/|package\.json|vite\.config\.|tsconfig\.|tsup\.)"; then task=true; fi

            # Dependency chain: `task` bundles both themes + task-ui-components,
            # and themes imports task-ui-components. A dependency change must
            # republish its dependents so their bundled copy AND pinned version
            # stay in sync — otherwise the published `task` ships a stale bundle.
            if [ "$ui" = "true" ]; then themes=true; task=true; fi
            if [ "$themes" = "true" ]; then task=true; fi
          fi

          echo "ui=$ui" >> $GITHUB_OUTPUT
          echo "themes=$themes" >> $GITHUB_OUTPUT
          echo "task=$task" >> $GITHUB_OUTPUT
          echo "Detected → task-ui-components=$ui themes=$themes task=$task"

      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.HADOKU_SITE_TOKEN }}" > ~/.npmrc
          echo "@wolffm:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      # Validate that required manually-maintained files exist
      - name: Validate required source files
        run: |
          echo "Checking for required manually-maintained files..."
          missing_files=0

          # Check for entry.d.ts (required by vite.config.ts copy-types plugin)
          if [ ! -f "src/app/entry.d.ts" ]; then
            echo "❌ ERROR: src/app/entry.d.ts is missing!"
            echo "   This file should be committed (exception in .gitignore)"
            missing_files=1
          else
            echo "✓ src/app/entry.d.ts exists"
          fi

          # Check that CSS files exist in task-ui-components (required by copy-css script)
          if [ ! -f "task-ui-components/src/theme-picker.css" ]; then
            echo "❌ ERROR: task-ui-components/src/theme-picker.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/theme-picker.css exists"
          fi

          if [ ! -f "task-ui-components/src/toaster.css" ]; then
            echo "❌ ERROR: task-ui-components/src/toaster.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/toaster.css exists"
          fi

          if [ ! -f "task-ui-components/src/context-menu.css" ]; then
            echo "❌ ERROR: task-ui-components/src/context-menu.css is missing!"
            missing_files=1
          else
            echo "✓ task-ui-components/src/context-menu.css exists"
          fi

          # Check themes CSS file
          if [ ! -f "themes/src/style.css" ]; then
            echo "❌ ERROR: themes/src/style.css is missing!"
            missing_files=1
          else
            echo "✓ themes/src/style.css exists"
          fi

          if [ $missing_files -eq 1 ]; then
            echo ""
            echo "💡 Tip: Check .gitignore for overly broad ignore patterns"
            echo "    that might be excluding required source files."
            exit 1
          fi

          echo "✅ All required source files present"

      # Build in dependency order: UI Components → Themes → Task
      - name: Build UI Components package
        run: pnpm --filter @wolffm/task-ui-components run build

      - name: Build Themes package
        run: pnpm --filter @wolffm/themes run build

      - name: Build Task package
        run: pnpm run build:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      # Fallback version bump check - ensures the version was incremented even if
      # the pre-commit hook was skipped. Uses the up-front change flags (never a
      # fresh diff) so the auto-bump commit can't mask the real changes.
      - name: Verify version bump (fallback check)
        id: version_check
        run: |
          echo "🔍 Checking if version was properly bumped..."

          # Function to check if a package version was published
          check_version_published() {
            local pkg_name=$1
            local pkg_path=$2
            local current_version=$(node -p "require('$pkg_path/package.json').version")

            echo "Checking $pkg_name@$current_version..."

            # Try to fetch the package info from registry
            if npm view "$pkg_name@$current_version" version 2>/dev/null | grep -q "$current_version"; then
              echo "⚠️  $pkg_name@$current_version already exists in registry!"
              return 1
            else
              echo "✓ $pkg_name@$current_version is a new version"
              return 0
            fi
          }

          version_issues=0
          needs_ui_bump=false
          needs_themes_bump=false
          needs_task_bump=false

          if [ "${{ steps.changes.outputs.ui }}" = "true" ]; then
            echo "📦 task-ui-components changed, checking version..."
            if ! check_version_published "@wolffm/task-ui-components" "./task-ui-components"; then
              echo "::warning::task-ui-components version was not bumped! Will auto-bump."
              version_issues=1
              needs_ui_bump=true
            fi
          else
            echo "ℹ️  task-ui-components: no changes (skipping version check)"
          fi

          if [ "${{ steps.changes.outputs.themes }}" = "true" ]; then
            echo "📦 themes changed, checking version..."
            if ! check_version_published "@wolffm/themes" "./themes"; then
              echo "::warning::themes version was not bumped! Will auto-bump."
              version_issues=1
              needs_themes_bump=true
            fi
          else
            echo "ℹ️  themes: no changes (skipping version check)"
          fi

          if [ "${{ steps.changes.outputs.task }}" = "true" ]; then
            echo "📦 task changed, checking version..."
            if ! check_version_published "@wolffm/task" "."; then
              echo "::warning::task version was not bumped! Will auto-bump."
              version_issues=1
              needs_task_bump=true
            fi
          else
            echo "ℹ️  task: no changes (skipping version check)"
          fi

          # Export flags for the auto-bump step
          echo "version_issues=$version_issues" >> $GITHUB_OUTPUT
          echo "needs_ui_bump=$needs_ui_bump" >> $GITHUB_OUTPUT
          echo "needs_themes_bump=$needs_themes_bump" >> $GITHUB_OUTPUT
          echo "needs_task_bump=$needs_task_bump" >> $GITHUB_OUTPUT

          if [ $version_issues -eq 1 ]; then
            echo ""
            echo "⚠️  VERSION BUMP MISSING - Will auto-bump in next step"
            echo ""
            echo "The pre-commit hook should have auto-bumped the version but didn't."
            echo "Possible causes:"
            echo "  1. Husky hooks not installed (run 'pnpm prepare')"
            echo "  2. Git hooks bypassed with --no-verify"
            echo "  3. Commit made by automation (Copilot, bot, etc.)"
            echo ""
            echo "✨ CI will auto-bump versions and continue..."
          else
            echo "✅ All changed packages have new versions (or no source changes requiring bump)"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      # Auto-bump versions if pre-commit hook was bypassed
      - name: Auto-bump versions
        if: steps.version_check.outputs.version_issues == '1'
        run: |
          echo "🤖 Auto-bumping versions that were missed by pre-commit hook..."

          # Function to compute the next version (handles .20 rollover to next minor)
          next_version() {
            local v=$1
            local maj=$(echo "$v" | cut -d. -f1)
            local min=$(echo "$v" | cut -d. -f2)
            local pat=$(echo "$v" | cut -d. -f3)
            if [[ $pat -eq 20 ]]; then
              echo "$maj.$((min + 1)).0"
            else
              echo "$maj.$min.$((pat + 1))"
            fi
          }

          # Function to bump version for a package.
          # Loops until it finds an unpublished version: a single-step bump is
          # insufficient because if the pre-commit hook was skipped AND a prior
          # CI run already burned current+1, we'd write a duplicate version and
          # pnpm publish silently no-ops ("no new packages") in pnpm 9+.
          bump_package_version() {
            local pkg_path=$1
            local pkg_name=$2

            local current_version=$(node -p "require('${pkg_path}/package.json').version")
            local new_version=$(next_version "$current_version")

            local max_attempts=50
            local attempts=0
            while npm view "$pkg_name@$new_version" version 2>/dev/null | grep -q "$new_version"; do
              echo "⚠️  $pkg_name: $new_version already published, trying next..."
              attempts=$((attempts + 1))
              if [ $attempts -ge $max_attempts ]; then
                echo "❌ $pkg_name: reached max bump attempts ($max_attempts)"
                exit 1
              fi
              new_version=$(next_version "$new_version")
            done

            # Update package.json with new version
            node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('${pkg_path}/package.json', 'utf8'));
          pkg.version = '$new_version';
          fs.writeFileSync('${pkg_path}/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

            echo "✅ $pkg_name: Version bumped: $current_version → $new_version"
          }

          # Handle dependency chain: if ui-components bumps, themes and task must also bump
          needs_ui_bump="${{ steps.version_check.outputs.needs_ui_bump }}"
          needs_themes_bump="${{ steps.version_check.outputs.needs_themes_bump }}"
          needs_task_bump="${{ steps.version_check.outputs.needs_task_bump }}"

          # If ui-components needs bump, dependents must also bump
          if [[ "$needs_ui_bump" = "true" ]]; then
            echo "📦 task-ui-components changed → bumping dependent packages (themes, task)"
            needs_themes_bump=true
            needs_task_bump=true
          fi

          # If themes needs bump, task must also bump
          if [[ "$needs_themes_bump" = "true" ]]; then
            echo "📦 themes changed → bumping dependent package (task)"
            needs_task_bump=true
          fi

          # Perform bumps in dependency order
          if [[ "$needs_ui_bump" = "true" ]]; then
            bump_package_version "./task-ui-components" "@wolffm/task-ui-components"
          fi

          if [[ "$needs_themes_bump" = "true" ]]; then
            bump_package_version "./themes" "@wolffm/themes"
          fi

          if [[ "$needs_task_bump" = "true" ]]; then
            bump_package_version "." "@wolffm/task"
          fi

          # Update lock file
          echo "🔄 Updating lock file..."
          pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push changes.
          # [skip ci] is REQUIRED: this run already builds + publishes below with
          # the freshly bumped versions, so the bump commit is only a bookkeeping
          # record. Without it the push re-triggers this workflow, which then sees
          # its own bump commit as "task changed", bumps again, and churns the
          # patch number on every run.
          git add -A
          git commit -m "chore: auto-bump versions (pre-commit hook was bypassed) [skip ci]"
          git push

          echo "✅ Versions auto-bumped and pushed successfully!"
          echo ""
          echo "🔄 Rebuilding with new versions..."

      # Rebuild if versions were auto-bumped
      - name: Rebuild after version bump
        if: steps.version_check.outputs.version_issues == '1'
        run: |
          echo "🔨 Rebuilding packages with new versions..."

          # Reinstall to pick up new versions
          pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile

          # Rebuild in dependency order
          pnpm --filter @wolffm/task-ui-components run build
          pnpm --filter @wolffm/themes run build
          pnpm run build:all

          echo "✅ Rebuild complete!"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      # Publish in dependency order: UI Components → Themes → Task, gated on the
      # up-front change flags (steps.changes) — NOT a fresh diff, which the
      # auto-bump commit would have corrupted.
      - name: Publish UI Components package
        if: steps.changes.outputs.ui == 'true'
        run: pnpm --filter @wolffm/task-ui-components publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      - name: Publish Themes package
        if: steps.changes.outputs.themes == 'true'
        run: pnpm --filter @wolffm/themes publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      - name: Publish Task package
        if: steps.changes.outputs.task == 'true'
        run: pnpm --filter @wolffm/task publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      # Defense in depth: pnpm publish does not fail loudly on duplicate-version
      # no-ops in pnpm 9+. Verify each package that was SUPPOSED to publish
      # actually landed on the registry, so any bump/detection regression fails
      # the workflow loudly instead of stranding a dependent on a missing pin.
      - name: Verify publishes appeared on registry
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.themes == 'true' || steps.changes.outputs.task == 'true'
        run: |
          verify_published() {
            local pkg_name=$1
            local pkg_path=$2
            local version=$(node -p "require('${pkg_path}/package.json').version")
            if ! npm view "${pkg_name}@${version}" version 2>/dev/null | grep -q "$version"; then
              echo "❌ ERROR: ${pkg_name}@${version} did not appear on the registry after publish"
              exit 1
            fi
            echo "✓ Verified ${pkg_name}@${version} on registry"
          }
          if [ "${{ steps.changes.outputs.ui }}" = "true" ]; then
            verify_published "@wolffm/task-ui-components" "./task-ui-components"
          fi
          if [ "${{ steps.changes.outputs.themes }}" = "true" ]; then
            verify_published "@wolffm/themes" "./themes"
          fi
          if [ "${{ steps.changes.outputs.task }}" = "true" ]; then
            verify_published "@wolffm/task" "."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      - name: Notify parent about package updates
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.themes == 'true' || steps.changes.outputs.task == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Notifying hadoku_site about package updates..."

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "⚠️  Warning: HADOKU_SITE_TOKEN not available, skipping notification"
            exit 0
          fi

          # Build array of updated packages in dependency order
          updated_packages="["
          first=true

          # UI Components first (no dependencies)
          if [ "${{ steps.changes.outputs.ui }}" = "true" ]; then
            updated_packages="${updated_packages}\"@wolffm/task-ui-components\""
            first=false
          fi

          # Themes second (depends on UI Components)
          if [ "${{ steps.changes.outputs.themes }}" = "true" ]; then
            if [ "$first" = "false" ]; then
              updated_packages="${updated_packages},"
            fi
            updated_packages="${updated_packages}\"@wolffm/themes\""
            first=false
          fi

          # Task last (depends on both)
          if [ "${{ steps.changes.outputs.task }}" = "true" ]; then
            if [ "$first" = "false" ]; then
              updated_packages="${updated_packages},"
            fi
            updated_packages="${updated_packages}\"@wolffm/task\""
          fi

          updated_packages="${updated_packages}]"

          echo "Updated packages: $updated_packages"

          payload=$(cat <<EOF
            {
              "event_type": "packages_updated",
              "client_payload": {
                "packages": $updated_packages,
                "sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}"
              }
            }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site about package updates"
          else
            echo "⚠️  Failed to notify hadoku_site (HTTP $status_code)"
          fi
