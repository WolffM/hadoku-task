name: Build and Deploy Task App

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: Build output directory 'dist' not found!"
            exit 1
          fi
          echo "✅ Build output found:"
          ls -la dist
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-dist
          path: dist/
          retention-days: 30
      
      - name: Trigger parent site deployment
        env:
          GH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Triggering hadoku_site deployment..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/WolffM/hadoku_site/dispatches \
            -f event_type='task_updated' \
            -f client_payload='{"run_id":"${{ github.run_id }}","sha":"${{ github.sha }}","ref":"${{ github.ref }}"}'
          echo "✅ Triggered hadoku_site deployment with run_id: ${{ github.run_id }}"